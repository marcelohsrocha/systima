<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Demandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('qd_tema')==='escuro'||(!localStorage.getItem('qd_tema')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
:root{
  --brand:#1F3A5F; --bg:#F4F5F8; --panel:#FFFFFF; --line:#E4E7EC; --line2:#EEF0F3;
  --text:#101828; --muted:#667085; --soft:#98A2B3;
  --red:#D92D20; --amber:#DC6803; --green:#039855; --blue:#1570EF;
  --radius:10px; --hover:#F9FAFB; --sub:#F2F4F7; --colbg:#EBEDF1; --text2:#344054; --brandTxt:var(--brand); --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}

/* ---------- topo ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px 0;flex-shrink:0}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.titulo{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sub)}
.eu{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;background:var(--panel)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brandTxt);border-bottom-color:var(--brand);font-weight:600}
.filtros{display:flex;gap:8px;align-items:center;padding:10px 18px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.inp{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);outline:none;min-width:0}
.inp:disabled{background:var(--hover);color:var(--muted);cursor:not-allowed}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.busca{width:220px}
.chip-tog{border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:var(--panel);font-size:13px}
.chip-tog.on{background:color-mix(in srgb,var(--brand) 10%,var(--panel));border-color:var(--brand);color:var(--brandTxt);font-weight:600}

/* ---------- área principal ---------- */
main{flex:1;overflow:auto;position:relative}
.vazio{color:var(--soft);text-align:center;padding:40px}

/* kanban */
.board{display:flex;gap:14px;padding:16px 18px;align-items:flex-start;min-height:100%;width:max-content}
.col{width:292px;flex-shrink:0;background:var(--colbg);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 175px)}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-weight:600}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h .n{color:var(--muted);font-weight:500;background:var(--panel);border-radius:10px;padding:0 8px;font-size:12px}
.col-h .btn{margin-left:auto}
.cards{padding:4px 8px 10px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:8px}
.cards.over{background:color-mix(in srgb,var(--brand) 6%,transparent);border-radius:8px}
.card{background:var(--panel);border-radius:var(--radius);padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;border-left:3px solid var(--cat,#ccc);transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 10px rgba(16,24,40,.1)}
.card.dragging{opacity:.45;transform:rotate(1.5deg)}
.card .t{font-weight:600;line-height:1.35;margin:6px 0 4px}
.card .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta .r{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,var(--panel));color:var(--c)}
.label{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--sub);color:var(--text2)}
.prazo{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;background:var(--sub)}
.prazo.late{background:#FEE4E2;color:var(--red);font-weight:600}
.prazo.soon{background:#FEF0C7;color:var(--amber);font-weight:600}
.prazo.ok{background:#D1FADF;color:var(--green)}
.prio{font-size:11px;font-weight:700;letter-spacing:.02em}
.prio.Urgente{color:var(--red)} .prio.Alta{color:var(--amber)} .prio.Baixa{color:var(--soft)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.av.lg{width:30px;height:30px;font-size:12px}
.av.none{background:var(--sub);color:var(--soft)}
.prog{height:4px;background:var(--sub);border-radius:4px;overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;background:var(--green)}
.timer-on{color:var(--red);font-weight:600;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.5}}

/* lista */
.tbl-wrap{padding:16px 18px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;background:var(--hover)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:var(--hover);cursor:pointer}
.tbl .grp td{background:var(--sub);font-weight:600;font-size:12px;color:var(--text2);cursor:default}

/* calendário */
.cal{padding:16px 18px;display:flex;gap:16px;align-items:flex-start}
.cal-main{flex:1;min-width:0}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-nav h3{margin:0;font-size:16px;min-width:170px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid7 .dow{background:var(--hover);padding:8px;font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.day{background:var(--panel);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px}
.day.out{background:var(--hover)}
.day.out .dn{color:var(--soft)}
.day.today .dn{background:var(--brand);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.day.over{background:color-mix(in srgb,var(--brand) 8%,var(--panel))}
.dn{font-size:12px;font-weight:600;color:var(--text2)}
.ev{font-size:11.5px;padding:3px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,var(--panel));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.ev.done{opacity:.55;text-decoration:line-through}
.ev.ext{background:var(--sub);border-left-color:var(--soft);color:var(--text2);cursor:default}
.side{width:240px;flex-shrink:0;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:12px}
.side h4{margin:0 0 8px;font-size:13px}

/* timeline */
.tl{padding:16px 18px}
.tl-box{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 190px)}
.tl-grid{display:grid;position:relative}
.tl-head{position:sticky;top:0;background:var(--hover);z-index:2;font-size:11px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);padding:6px 0}
.tl-head.wk{font-weight:700;color:var(--text2)}
.tl-name{position:sticky;left:0;background:var(--panel);z-index:1;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-cell{border-bottom:1px solid var(--line2);border-right:1px dashed #F2F4F7}
.tl-cell.we{background:var(--hover)}
.tl-bar{position:absolute;height:20px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;opacity:.6}

/* carga */
.wl{padding:16px 18px}
.wl table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.wl th{font-size:12px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--hover)}
.wl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.cap{height:8px;border-radius:5px;background:var(--sub);overflow:hidden;margin:6px 0 4px}
.cap>i{display:block;height:100%}
.wl .mini{font-size:11.5px;color:var(--muted)}

/* dashboard */
.dash{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .h{font-size:12px;color:var(--soft)}
.panel{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;grid-column:span 2}
.panel h4{margin:0 0 12px;font-size:13.5px}
.hb{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.hb .bar{height:12px;background:var(--sub);border-radius:6px;overflow:hidden;display:flex}
.hb .bar i{display:block;height:100%}
.hb .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.vb .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.vb .c i{display:block;width:100%;max-width:36px;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px}
.vb .c b{color:var(--text);font-size:12px}
@media(max-width:900px){.panel{grid-column:span 1}}

/* drawer */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:20;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:21;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(16,24,40,.12)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow-y:auto;padding:16px 20px 30px}
.dr-title{width:100%;border:1px solid transparent;border-radius:8px;font-size:20px;font-weight:700;padding:4px 6px;margin-left:-6px;letter-spacing:-.01em}
.dr-title:hover{border-color:var(--line)}
.dr-title:focus{outline:none;border-color:var(--brand)}
.props{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:center;margin:14px 0 6px}
.props label{color:var(--muted);font-size:13px}
.props .inp{width:100%}
.sec{margin-top:22px}
.sec h5{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.sec h5 .c{color:var(--soft);font-weight:500}
.brief{background:var(--hover);border:1px solid var(--line2);border-radius:10px;padding:4px 14px}
.brief div{padding:9px 0;border-bottom:1px solid var(--line2)}
.brief div:last-child{border:0}
.brief b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.ck{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px}
.ck:hover{background:var(--hover)}
.ck input[type=checkbox]{width:16px;height:16px;accent-color:var(--green)}
.ck span{flex:1}
.ck.feito span{text-decoration:line-through;color:var(--soft)}
.ck .x{opacity:0;border:0;background:none;color:var(--soft)}
.ck:hover .x{opacity:1}
.att{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;text-decoration:none;color:var(--text)}
.att:hover{background:var(--hover)}
.time{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--hover);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.time .big{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.subtabs button{border:0;background:none;padding:7px 10px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.subtabs button.on{color:var(--brandTxt);border-bottom-color:var(--brand)}
.cm{display:flex;gap:10px;margin-bottom:14px}
.cm .bx{flex:1;background:var(--hover);border-radius:10px;padding:8px 12px}
.cm .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.cm .who b{color:var(--text)}
.cm .tx{white-space:pre-wrap;line-height:1.45}
.mention{color:var(--blue);font-weight:600}
.hist{font-size:12.5px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--line2)}
.hist .d{color:var(--soft);font-size:11.5px}
textarea.inp{width:100%;min-height:70px;resize:vertical}

/* modal */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(16,24,40,.4)}
.modal.on{display:grid}
.modal .box{background:var(--panel);border-radius:14px;width:min(520px,94vw);padding:20px 22px;box-shadow:0 20px 40px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.fgrid .inp{width:100%}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#101828;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;transition:transform .25s;font-size:13px}
.toast.on{transform:translateX(-50%)}
.demo{background:#FEF0C7;color:#93370D;font-size:12px;text-align:center;padding:5px;flex-shrink:0}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
body.leitor .so-edit{display:none!important}
.pops{position:fixed;top:14px;right:14px;z-index:35;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px))}
.pop{background:var(--panel);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.22);border-left:4px solid var(--c,#1F3A5F);padding:12px 14px;animation:entra .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes entra{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
.pop .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.03em}
.pop .hd .x{margin-left:auto;border:0;background:none;color:var(--soft);font-size:16px;cursor:pointer}
.pop .tt{font-weight:700;font-size:15px;margin:6px 0 4px}
.pop .ln{font-size:12.5px;color:var(--muted)}
.pop .ac{display:flex;gap:6px;margin-top:10px}
.novo{font-size:10px;font-weight:800;color:#fff;background:var(--green);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.lock{font-size:12px;color:var(--muted);background:var(--sub);border-radius:8px;padding:8px 10px;margin:10px 0}
.perf{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}

@media(max-width:700px){
  .busca{width:100%}
  .col{width:84vw;max-height:calc(100vh - 230px)}
  .board{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .props{grid-template-columns:100px 1fr}
  .side{display:none}
  .hide-m{display:none}
}

/* ---------- modo escuro ---------- */
html.dark{color-scheme:dark;
  --bg:#0F141B; --panel:#171D26; --line:#2A3340; --line2:#222A35; --text:#E6EAF0; --muted:#98A2B3; --soft:#6B7684;
  --hover:#1E2631; --sub:#232C38; --colbg:#131922; --text2:#C5CCD6;
  --brandTxt:color-mix(in srgb,var(--brand) 40%,#fff);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.5)}
html.dark .card,html.dark .drawer,html.dark .modal{box-shadow:0 8px 24px rgba(0,0,0,.45)}
html.dark .inp:disabled{color:var(--soft)}
html.dark img{opacity:.92}
html.dark ::-webkit-scrollbar{width:10px;height:10px}
html.dark ::-webkit-scrollbar-thumb{background:#2F3946;border-radius:6px}
html.dark ::-webkit-scrollbar-track{background:transparent}
.tema{font-size:15px;padding:6px 9px}
.rep-info{background:color-mix(in srgb,var(--brand) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.55}
.rec-box{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--sub);border-radius:8px;padding:10px 12px}
.rec-st{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--text2)}
.rec-st.on{background:color-mix(in srgb,#039855 15%,var(--panel));color:#027A48}
html.dark .rec-st.on{color:#6CE9A6}
.rec-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rec-row.off{opacity:.6}
.rec-t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.rec-row{flex-wrap:wrap}}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sw{height:40px;border-radius:9px;border:1px solid var(--line);position:relative;padding:0;font-size:11px;color:var(--muted)}
.sw:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.sw.on{outline:2px solid var(--brand);outline-offset:2px}
html.fundo-escuro .vazio,html.fundo-escuro main>.load,html.fundo-escuro .cal-nav .sub,html.fundo-escuro .wl>.sub{color:var(--bgMuted)}
html.fundo-escuro .cal-nav h3{color:var(--bgTxt)}
body{background-size:cover;background-position:center;background-attachment:fixed}
html.fundo-foto .col{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html.fundo-foto .wl,html.fundo-foto .cal-side{backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="demo" class="demo" style="display:none">Modo demonstração — dados de exemplo. Instale na planilha para usar com o Google Forms e o Google Agenda.</div>
<header class="top">
  <div class="row1">
    <div class="logo" id="logo">Q</div>
    <div>
      <div class="titulo" id="nomeQuadro">Quadro de Demandas</div>
      <div class="sub" id="resumo">carregando…</div>
    </div>
    <div class="sp"></div>
    <button class="btn ghost tema" onclick="abrirFundo()" title="Fundo do quadro (cor ou foto)">🎨</button>
    <button class="btn ghost tema" id="btnTema" onclick="alternarTema()" title="Modo escuro">🌙</button>
    <button class="btn ghost hide-m" onclick="carregar(true)" title="Atualizar">⟳ Atualizar</button>
    <button class="btn hide-m" id="btnLimpar" style="display:none" onclick="abrirLimpeza()">🧹 Limpar</button>
    <button class="btn hide-m" id="btnEquipe" style="display:none" onclick="abrirEquipe()">👥 Equipe</button>
    <button class="btn hide-m" id="btnRec" style="display:none" onclick="abrirRecorrentes()">🔁 Recorrentes</button>
    <a class="btn hide-m" id="btnTrello" style="display:none;text-decoration:none" target="_top">⇪ Importar do Trello</a>
    <button class="btn pri so-edit" onclick="abrirNova()">＋ Nova demanda</button>
    <div class="eu" onclick="menuEu()" style="cursor:pointer" title="Conta"><span id="euAv"></span><span style="display:flex;flex-direction:column;line-height:1.15"><span id="euNome" style="font-weight:500;font-size:13px">Entrar</span><span class="perf" id="euPerf"></span></span></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="filtros">
  <input class="inp busca" id="fBusca" placeholder="🔍 Buscar demanda, solicitante…" oninput="S.f.q=this.value;render()">
  <select class="inp" id="fCat" onchange="S.f.cat=this.value;render()"></select>
  <select class="inp" id="fResp" onchange="S.f.resp=this.value;render()"></select>
  <select class="inp" id="fPrio" onchange="S.f.prio=this.value;render()"></select>
  <button class="chip-tog" id="fMinhas" onclick="S.f.minhas=!S.f.minhas;this.classList.toggle('on',S.f.minhas);render()">👤 Minhas</button>
  <button class="chip-tog" id="fAtras" onclick="S.f.atras=!S.f.atras;this.classList.toggle('on',S.f.atras);render()">⏰ Atrasadas</button>
  <button class="chip-tog" id="fArq" onclick="S.f.arq=!S.f.arq;this.classList.toggle('on',S.f.arq);carregar(true)">🗄️ Arquivadas</button>
</div>
<main id="main"><div class="load">Carregando quadro…</div></main>

<div class="ov" id="ov" onclick="fecharDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div id="cfgExec" data-h="<?= (ScriptApp.getService().getUrl() || '').substring(8) ?>" hidden></div>
<div class="pops" id="pops"></div>

<script>
/* =========================================================
 *  ESTADO E COMUNICAÇÃO
 * ========================================================= */
const MOCK = !(window.google && google.script && google.script.run);
const S = {
  cfg:null, cats:[], equipe:[], tarefas:[], view:lsGet('qd_view')||'kanban',
  f:{q:'',cat:'',resp:'',prio:'',minhas:false,atras:false,arq:false},
  eu:lsGet('qd_eu')||'', pin:lsGet('qd_pin')||'', me:null, aberto:null, det:null, subtab:'com', drag:null,
  sort:{k:'prazo',d:1}, calMes:null
};
function mostrarErro(m){try{const el=document.getElementById('main');if(el&&!S.cfg)el.innerHTML='<div class="vazio" style="color:#B42318">⚠️ '+String(m).replace(/[<>&]/g,'')+'</div>';toast('⚠️ '+m)}catch(e){}}
window.addEventListener('error',e=>mostrarErro('Erro no quadro: '+e.message));
const VIEWS = [['kanban','▦ Quadro'],['lista','☰ Lista'],['cal','📅 Calendário'],['tl','▬ Linha do tempo'],['carga','⚖ Carga de trabalho'],['dash','📊 Dashboard']];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function call(acao,p){
  p=Object.assign({},p||{},{autor:S.eu,pin:S.pin});
  if(MOCK){try{return Promise.resolve(mockApi(acao,JSON.parse(JSON.stringify(p))))}catch(e){return Promise.reject(tratarErro(e))}}
  return viaHttp(acao,p).catch(err=>{throw tratarErro(err)});
}
function urlExec(){const el=document.getElementById('cfgExec');const h=el?el.getAttribute('data-h')||'':'';return h&&h.indexOf('<')<0?'https:'+String.fromCharCode(47,47)+h:''}
function viaRun(acao,p){return new Promise((res,rej)=>{try{google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(acao,p,lsGet('qd_codigo')||'')}catch(e){rej(e)}})}
async function viaHttp(acao,p){
  const url=urlExec();
  if(!url)return viaRun(acao,p);
  const ctrl=new AbortController();const tm=setTimeout(()=>ctrl.abort(),60000);
  let resp;
  try{
    resp=await fetch(url,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao,p,codigo:lsGet('qd_codigo')||''}),signal:ctrl.signal});
  }catch(e){
    clearTimeout(tm);
    if(e.name==='AbortError')throw new Error('O servidor não respondeu ('+acao+'). Recarregue a página.');
    return viaRun(acao,p);
  }
  clearTimeout(tm);
  let d;try{d=await resp.json()}catch(e){return viaRun(acao,p)}
  if(!d.ok)throw new Error(d.erro||'Erro no servidor');
  return d.r;
}
function tratarErro(err){
  const m=String(err&&err.message||err);
  if(m.includes('ACESSO_NEGADO'))pedirCodigo();
  else if(m.includes('LOGIN'))login(S.eu?'Nome ou PIN incorreto. Entre de novo.':'');
  else if(m.includes('SEM_PERMISSAO')){toast('🔒 '+m.split('SEM_PERMISSAO:')[1].trim());carregar()}
  else mostrarErro(m);
  return err;
}
const perfil=()=>S.me?S.me.perfil:'Leitor';
const gestor=()=>perfil()==='Gestor';
function pode(t){if(gestor())return true;if(perfil()!=='Membro')return false;return !t.responsavel||t.responsavel===S.me.nome}

async function carregar(manual,silencioso){
  try{
    const d=await call('board',{arquivadas:S.f.arq});
    if(silencioso&&ocupado()){detectarNovas(d.tarefas,d.me);return}
    S.cfg=d.config;S.cats=d.categorias;S.equipe=d.equipe;S.tarefas=d.tarefas;S.recs=d.recorrencias||[];aplicarPendentes();S.me=d.me||(S.eu?{nome:S.eu,perfil:'Gestor'}:null);
    if(d.me){S.eu=d.me.nome;lsSet('qd_eu',S.eu)}
    document.body.classList.toggle('leitor',perfil()==='Leitor');
    if(gestor()&&S.cfg.urlApp){$('btnTrello').href=S.cfg.urlApp+'?pagina=importar';$('btnTrello').style.display=''}else $('btnTrello').style.display='none';
    $('btnEquipe').style.display=gestor()?'':'none';
    $('btnLimpar').style.display=gestor()?'':'none';
    $('btnRec').style.display=S.me&&(S.recs.length||perfil()!=='Leitor')?'':'none';
    document.documentElement.style.setProperty('--brand',S.cfg.cor||'#1F3A5F');
    aplicarFundo();
    document.getElementById('nomeQuadro').textContent=S.cfg.nome||'Quadro de Demandas';
    document.getElementById('logo').textContent=(S.cfg.nome||'Q').trim()[0].toUpperCase();
    document.title=S.cfg.nome||'Quadro de Demandas';
    detectarNovas(S.tarefas,S.me);
    montarFiltros();render();atualizarEu();
    if(S.aberto){const t=tarefa(S.aberto);if(t)renderDrawer()}
    if(manual===true)toast('Quadro atualizado');
    if(!S.me)login();
  }catch(e){console.error(e)}
}

/* =========================================================
 *  UTILITÁRIOS
 * ========================================================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hojeISO(){const d=new Date();return iso(d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseISO(s){if(!s)return null;const [a,m,d]=s.slice(0,10).split('-').map(Number);return new Date(a,m-1,d)}
function addDias(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function diasEntre(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5)}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtD(s){if(!s)return '';const d=parseISO(s);return d.getDate()+' '+MESES[d.getMonth()]}
function fmtBR(s){if(!s)return '—';const [a,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+a+(s.length>10?' '+s.slice(11,16):'')}
function fmtMin(m){m=Number(m)||0;const h=Math.floor(m/60);return (h?h+'h ':'')+(m%60)+'min'}
function cat(n){return S.cats.find(c=>c.nome===n)||{nome:n||'Sem categoria',cor:'#98A2B3'}}
function tarefa(id){return S.tarefas.find(t=>t.id===id)}
function corPessoa(n){if(!n)return '#D0D5DD';let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 45%)`}
function iniciais(n){return String(n||'?').split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase()}
function av(n,lg){return n?`<span class="av ${lg?'lg':''}" style="background:${corPessoa(n)}" title="${esc(n)}">${esc(iniciais(n))}</span>`:`<span class="av none ${lg?'lg':''}" title="Sem responsável">?</span>`}
function concluida(t){return t.status===S.cfg.colunaFinal}
function situacaoPrazo(t){
  if(!t.prazo)return '';
  if(concluida(t))return 'ok';
  const d=diasEntre(hojeISO(),t.prazo);
  return d<0?'late':d<=2?'soon':'';
}
function chipPrazo(t){
  if(!t.prazo)return '';
  const s=situacaoPrazo(t);const d=diasEntre(hojeISO(),t.prazo);
  const txt=concluida(t)?fmtD(t.prazo):d<0?`${-d}d atrasada`:d===0?'Hoje':d===1?'Amanhã':fmtD(t.prazo);
  return `<span class="prazo ${s}">🗓 ${txt}</span>`;
}
function tags(t){return String(t.etiquetas||'').split(',').map(s=>s.trim()).filter(Boolean)}
function checkProg(t){const c=t.checklist||[];if(!c.length)return null;const f=c.filter(i=>i.feito).length;return {f,n:c.length,p:Math.round(f/c.length*100)}}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function hl(txt){return esc(txt).replace(/@([A-Za-zÀ-ÿ]+)/g,'<span class="mention">@$1</span>')}

/* =========================================================
 *  FILTROS
 * ========================================================= */
function montarFiltros(){
  const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(l)}</option>`;
  $('fCat').innerHTML=opt('','Todas as categorias',S.f.cat)+S.cats.map(c=>opt(c.nome,c.nome,S.f.cat)).join('');
  $('fResp').innerHTML=opt('','Todos os responsáveis',S.f.resp)+opt('__none','Sem responsável',S.f.resp)+S.equipe.map(m=>opt(m.nome,m.nome,S.f.resp)).join('');
  $('fPrio').innerHTML=opt('','Todas as prioridades',S.f.prio)+S.cfg.prioridades.map(p=>opt(p,p,S.f.prio)).join('');
  $('tabs').innerHTML=VIEWS.map(([k,l])=>`<button class="tab ${S.view===k?'on':''}" onclick="trocarView('${k}')">${l}</button>`).join('');
}
function trocarView(v){S.view=v;lsSet('qd_view',v);montarFiltros();render()}
function filtradas(){
  const q=S.f.q.trim().toLowerCase();
  return S.tarefas.filter(t=>{
    if(S.f.cat&&t.categoria!==S.f.cat)return false;
    if(S.f.resp==='__none'&&t.responsavel)return false;
    if(S.f.resp&&S.f.resp!=='__none'&&t.responsavel!==S.f.resp)return false;
    if(S.f.prio&&t.prioridade!==S.f.prio)return false;
    if(S.f.minhas&&t.responsavel!==S.eu)return false;
    if(S.f.atras&&situacaoPrazo(t)!=='late')return false;
    if(S.f.arq&&t.arquivada!=='SIM')return false;
    if(q){const hay=[t.titulo,t.solicitante,t.categoria,t.responsavel,t.etiquetas,(t.briefing||[]).map(b=>b.r).join(' ')].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}

/* =========================================================
 *  RENDER
 * ========================================================= */
function render(){
  if(!S.cfg)return;
  const ts=filtradas();
  const abertas=S.tarefas.filter(t=>!concluida(t)&&t.arquivada!=='SIM');
  const atras=abertas.filter(t=>situacaoPrazo(t)==='late').length;
  $('resumo').textContent=`${abertas.length} em aberto · ${atras} atrasada${atras===1?'':'s'}${S.cfg.agenda?' · sincronizado com Google Agenda':''}`;
  const m=$('main');
  ({kanban:renderKanban,lista:renderLista,cal:renderCal,tl:renderTL,carga:renderCarga,dash:renderDash}[S.view]||renderKanban)(m,ts);
}

/* ---------- Kanban ---------- */
function cardHTML(t){
  const c=cat(t.categoria);const pr=checkProg(t);
  return `<div class="card" draggable="${pode(t)}" data-id="${t.id}" style="--cat:${c.cor}" onclick="abrir('${t.id}')">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span class="tag" style="--c:${c.cor}">${esc(c.nome)}</span>
      ${t.prioridade&&t.prioridade!=='Normal'?`<span class="prio ${esc(t.prioridade)}">${t.prioridade==='Urgente'?'🔥 ':t.prioridade==='Alta'?'▲ ':''}${esc(t.prioridade)}</span>`:''}
      ${tags(t).map(x=>`<span class="label">${esc(x)}</span>`).join('')}
    </div>
    <div class="t">${ehNova(t.id)?'<span class="novo">NOVA</span> ':''}${esc(t.titulo)}</div>
    ${t.solicitante?`<div class="s">${esc(t.solicitante)}</div>`:''}
    ${pr?`<div class="prog" title="${pr.f}/${pr.n} itens"><i style="width:${pr.p}%"></i></div>`:''}
    <div class="meta">
      ${chipPrazo(t)}
      ${pr?`<span>☑ ${pr.f}/${pr.n}</span>`:''}
      ${t.comentarios?`<span>💬 ${t.comentarios}</span>`:''}
      ${(t.anexos||[]).length?`<span>📎 ${t.anexos.length}</span>`:''}
      ${t.timerInicio?`<span class="timer-on">● rodando</span>`:''}
      ${t.eventoId?'<span title="Na agenda">📅</span>':''}
      ${ehRecorrente(t)?`<span title="Demanda recorrente${recDe(t)?': '+esc(recDe(t).texto):''}">🔁</span>`:''}
      <span class="r">${av(t.responsavel)}</span>
    </div>
  </div>`;
}
function renderKanban(m,ts){
  const cols=S.cfg.colunas;
  m.innerHTML=`<div class="board">${cols.map((c,i)=>{
    const lista=ts.filter(t=>t.status===c||(i===0&&!cols.includes(t.status))).sort((a,b)=>Number(a.ordem)-Number(b.ordem));
    const cor=i===cols.length-1?'#039855':['#98A2B3','#1570EF','#DC6803','#7A5AF8','#0E9384'][i%5];
    return `<section class="col"><div class="col-h"><span class="dot" style="background:${cor}"></span>${esc(c)} <span class="n">${lista.length}</span>
      ${i===0&&perfil()!=='Leitor'?`<button class="btn ghost sm" onclick="abrirNova('${esc(c)}')">＋</button>`:''}</div>
      <div class="cards" data-col="${esc(c)}">${lista.map(cardHTML).join('')||''}</div></section>`;
  }).join('')}</div>`;
  ligarDnD(m);
}
function ligarDnD(m){
  m.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart',e=>{S.drag=el.dataset.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',el.dataset.id)});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');S.drag=null;if(S.renderDepois){S.renderDepois=false;setTimeout(render,0)}m.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
  });
  m.querySelectorAll('.cards').forEach(list=>{
    list.addEventListener('dragover',e=>{
      e.preventDefault();list.classList.add('over');
      const drag=m.querySelector('.dragging');if(!drag)return;
      const after=[...list.querySelectorAll('.card:not(.dragging)')].find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
      after?list.insertBefore(drag,after):list.appendChild(drag);
    });
    list.addEventListener('dragleave',e=>{if(!list.contains(e.relatedTarget))list.classList.remove('over')});
    list.addEventListener('drop',e=>{
      e.preventDefault();list.classList.remove('over');
      const el=m.querySelector('.dragging');if(!el)return;
      const id=el.dataset.id,status=list.dataset.col;
      const prev=el.previousElementSibling,next=el.nextElementSibling;
      const po=prev?Number(tarefa(prev.dataset.id).ordem):null,no=next?Number(tarefa(next.dataset.id).ordem):null;
      const ordem=po!=null&&no!=null?(po+no)/2:po!=null?po+1000:no!=null?no-1000:Date.now();
      const t=tarefa(id);const mudouStatus=t.status!==status;
      const orig={status:t.status,ordem:t.ordem,concluidaEm:t.concluidaEm,timerInicio:t.timerInicio};
      t.status=status;t.ordem=String(ordem);
      if(mudouStatus){t.concluidaEm=status===S.cfg.colunaFinal?hojeISO()+' 00:00':'';if(status===S.cfg.colunaFinal)t.timerInicio=''}
      pendAdd(id,{status:t.status,ordem:t.ordem,concluidaEm:t.concluidaEm,timerInicio:t.timerInicio});
      render();
      call('mover',{id,status,ordem:String(ordem),autor:S.eu}).then(nt=>{
        pendFim(id);const tt=tarefa(id);if(tt&&!S.pend[id])Object.assign(tt,nt);renderSeguro();if(mudouStatus)toast(`Movida para “${status}”`);
      }).catch(err=>{
        pendFim(id);const tt=tarefa(id);if(tt&&!S.pend[id])Object.assign(tt,orig);renderSeguro();toast('Não foi possível mover: '+msgErro(err)+' A demanda voltou para onde estava.');
      });
    });
  });
}

/* ---------- Lista ---------- */
function renderLista(m,ts){
  const k=S.sort.k,d=S.sort.d;
  const val=t=>k==='prazo'?(t.prazo||'9999'):k==='prio'?S.cfg.prioridades.indexOf(t.prioridade)*-1:String(t[k]||'').toLowerCase();
  const arr=[...ts].sort((a,b)=>(val(a)>val(b)?1:val(a)<val(b)?-1:0)*d);
  const th=(key,l)=>`<th onclick="ordenar('${key}')">${l}${S.sort.k===key?(d>0?' ↑':' ↓'):''}</th>`;
  const grupos=S.cfg.colunas.map(c=>[c,arr.filter(t=>t.status===c)]).filter(g=>g[1].length);
  m.innerHTML=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${th('titulo','Demanda')}${th('categoria','Categoria')}${th('responsavel','Responsável')}${th('prazo','Prazo')}${th('prio','Prioridade')}<th class="hide-m">Progresso</th><th class="hide-m">Tempo</th></tr></thead><tbody>
  ${grupos.map(([g,l])=>`<tr class="grp"><td colspan="7">${esc(g)} · ${l.length}</td></tr>`+l.map(t=>{const c=cat(t.categoria),pr=checkProg(t);return `<tr onclick="abrir('${t.id}')">
    <td><b>${esc(t.titulo)}</b>${t.solicitante?`<div class="sub">${esc(t.solicitante)}</div>`:''}</td>
    <td><span class="tag" style="--c:${c.cor}">${esc(c.nome)}</span></td>
    <td style="white-space:nowrap">${av(t.responsavel)} ${esc(t.responsavel||'')}</td>
    <td>${chipPrazo(t)||'<span class="sub">—</span>'}</td>
    <td><span class="prio ${esc(t.prioridade)}">${esc(t.prioridade)}</span></td>
    <td class="hide-m" style="min-width:90px">${pr?`<div class="prog" style="margin:0"><i style="width:${pr.p}%"></i></div><span class="sub">${pr.f}/${pr.n}</span>`:'<span class="sub">—</span>'}</td>
    <td class="hide-m sub">${Number(t.tempoMin)?fmtMin(t.tempoMin):'—'}${t.estimativa?` / ${t.estimativa}h`:''}</td></tr>`}).join('')).join('')||'<tr><td colspan="7" class="vazio">Nenhuma demanda encontrada</td></tr>'}
  </tbody></table></div>`;
}
function ordenar(k){S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};render()}

/* ---------- Calendário ---------- */
function renderCal(m,ts){
  const base=S.calMes||new Date(new Date().getFullYear(),new Date().getMonth(),1);S.calMes=base;
  const ini=new Date(base);ini.setDate(1-((base.getDay()+6)%7));
  const hoje=hojeISO();const dias=[];
  for(let i=0;i<42;i++){const d=new Date(ini);d.setDate(ini.getDate()+i);dias.push(d)}
  const semPrazo=ts.filter(t=>!t.prazo&&!concluida(t));
  const kAg=iso(base);if(S.mostrarAg!==false)carregarAgenda(kAg,iso(dias[0]),iso(dias[41]));
  const ags=S.mostrarAg===false?[]:((S.ag||{})[kAg]||[]);
  const agDia=k=>ags.filter(e=>e.data===k).slice(0,3).map(e=>`<div class="ev ext" title="${esc(e.titulo+(e.local?' · '+e.local:'')+' — '+e.agenda)}">${e.hora?esc(e.hora)+' ':''}${esc(e.titulo)}</div>`).join('');
  let nomeMes=base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});nomeMes=nomeMes[0].toUpperCase()+nomeMes.slice(1);
  m.innerHTML=`<div class="cal"><div class="cal-main">
    <div class="cal-nav"><button class="btn sm" onclick="mudaMes(-1)">‹</button><h3>${nomeMes}</h3><button class="btn sm" onclick="mudaMes(1)">›</button><button class="btn sm" onclick="S.calMes=null;render()">Hoje</button>
    <label class="sub" style="display:flex;gap:6px;align-items:center;margin-left:8px"><input type="checkbox" ${S.mostrarAg===false?'':'checked'} onchange="S.mostrarAg=this.checked;render()"> Agenda geral</label>

/* ---------- Linha do tempo ---------- */
function renderTL(m,ts){
  const hoje=hojeISO();const ini=addDias(hoje,-7-((parseISO(hoje).getDay()+6)%7));const N=49,W=30,NAME=230;
  const lista=ts.filter(t=>t.prazo).sort((a,b)=>(a.responsavel||'~').localeCompare(b.responsavel||'~')||a.prazo.localeCompare(b.prazo));
  const dias=[...Array(N)].map((_,i)=>addDias(ini,i));
  let head=`<div class="tl-head" style="grid-column:1;grid-row:1/3;position:sticky;left:0;z-index:3;text-align:left;padding-left:10px">Demanda</div>`;
  for(let w=0;w<N/7;w++)head+=`<div class="tl-head wk" style="grid-column:${2+w*7}/span 7;grid-row:1">${fmtD(dias[w*7])} – ${fmtD(dias[w*7+6])}</div>`;
  dias.forEach((d,i)=>head+=`<div class="tl-head" style="grid-column:${i+2};grid-row:2;top:25px">${parseISO(d).getDate()}</div>`);
  let rows='',bars='';const RH=35,TOP=50;
  lista.forEach((t,r)=>{
    rows+=`<div class="tl-name" style="grid-column:1;grid-row:${r+3}" onclick="abrir('${t.id}')">${av(t.responsavel)} ${esc(t.titulo)}</div>`;
    dias.forEach((d,i)=>{const dw=parseISO(d).getDay();rows+=`<div class="tl-cell ${dw===0||dw===6?'we':''}" style="grid-column:${i+2};grid-row:${r+3}"></div>`});
    let a=t.inicio||t.criadoEm.slice(0,10);if(a>t.prazo)a=t.prazo;
    const s=Math.max(0,diasEntre(ini,a)),e=Math.min(N-1,diasEntre(ini,t.prazo));
    if(e<0||s>N-1)return;
    const c=concluida(t)?'#12B76A':situacaoPrazo(t)==='late'?'#D92D20':cat(t.categoria).cor;
    bars+=`<div class="tl-bar" style="--c:${c};left:${NAME+s*W+2}px;width:${Math.max(W-4,(e-s+1)*W-4)}px;top:${TOP+r*RH+7}px" onclick="abrir('${t.id}')" title="${esc(t.titulo)} · ${fmtBR(a)} → ${fmtBR(t.prazo)}">${esc(t.titulo)}</div>`;
  });
  const hojeX=NAME+diasEntre(ini,hoje)*W+W/2;
  m.innerHTML=`<div class="tl"><div class="tl-box"><div class="tl-grid" style="grid-template-columns:${NAME}px repeat(${N},${W}px);grid-template-rows:25px 25px repeat(${lista.length},${RH}px)">
    ${head}${rows}${bars}<div class="tl-today" style="left:${hojeX}px"></div></div></div>
    ${lista.length?'':'<div class="vazio">Nenhuma demanda com prazo nesse filtro</div>'}</div>`;
}

/* ---------- Carga de trabalho ---------- */
function renderCarga(m,ts){
  const hoje=hojeISO();const seg=addDias(hoje,-((parseISO(hoje).getDay()+6)%7));
  const semanas=[...Array(5)].map((_,i)=>addDias(seg,i*7));
  const abertas=ts.filter(t=>!concluida(t));
  const pessoas=[...S.equipe.map(p=>p.nome),''];
  const linha=nome=>{
    const p=S.equipe.find(x=>x.nome===nome)||{capacidade:0};
    const minhas=abertas.filter(t=>(t.responsavel||'')===nome);
    if(!nome&&!minhas.length)return '';
    const atras=minhas.filter(t=>situacaoPrazo(t)==='late');
    const cel=(lista,label)=>{
      const h=lista.reduce((s,t)=>s+(Number(t.estimativa)||0),0);const semEst=lista.filter(t=>!Number(t.estimativa)).length;
      const cap=p.capacidade||0;const pct=cap?Math.min(100,h/cap*100):0;const cor=!cap?'#98A2B3':h>cap?'#D92D20':h>cap*.8?'#DC6803':'#12B76A';
      return `<td><b>${lista.length}</b> <span class="mini">demanda${lista.length===1?'':'s'}</span>
        ${cap?`<div class="cap"><i style="width:${pct}%;background:${cor}"></i></div><span class="mini">${h}h de ${cap}h${semEst?` · ${semEst} sem estimativa`:''}</span>`:`<div class="mini">${h?h+'h estimadas':''}</div>`}
        ${label||''}</td>`;
    };
    return `<tr><td style="white-space:nowrap">${av(nome,1)} <b>${esc(nome||'Sem responsável')}</b>${p.funcao?`<div class="mini" style="margin-left:36px">${esc(p.funcao)}</div>`:''}</td>
      <td>${atras.length?`<b style="color:var(--red)">${atras.length}</b>`:'<span class="mini">0</span>'}</td>
      ${semanas.map(s=>cel(minhas.filter(t=>t.prazo&&t.prazo>=s&&t.prazo<addDias(s,7)))).join('')}
      <td><b>${minhas.filter(t=>!t.prazo).length}</b></td></tr>`;
  };
  m.innerHTML=`<div class="wl"><table><thead><tr><th>Pessoa</th><th>Atrasadas</th>${semanas.map((s,i)=>`<th>${i===0?'Esta semana':'Semana de '+fmtD(s)}</th>`).join('')}<th>Sem prazo</th></tr></thead>
  <tbody>${pessoas.map(linha).join('')}</tbody></table>
  <p class="sub" style="margin-top:10px">A barra compara as horas estimadas com a capacidade semanal de cada pessoa (aba Equipe). Verde até 80%, laranja até 100%, vermelho quando passa da capacidade.</p></div>`;
}

/* ---------- Dashboard ---------- */
function renderDash(m,ts){
  const hoje=hojeISO();const d30=addDias(hoje,-30);
  const abertas=ts.filter(t=>!concluida(t));
  const atras=abertas.filter(t=>situacaoPrazo(t)==='late');
  const entregues=ts.filter(t=>concluida(t)&&t.concluidaEm&&t.concluidaEm.slice(0,10)>=d30);
  const lead=entregues.map(t=>diasEntre(t.criadoEm.slice(0,10),t.concluidaEm.slice(0,10)));
  const leadMed=lead.length?(lead.reduce((a,b)=>a+b,0)/lead.length).toFixed(1):'—';
  const comPrazo=entregues.filter(t=>t.prazo);const noPrazo=comPrazo.filter(t=>t.concluidaEm.slice(0,10)<=t.prazo);
  const pct=comPrazo.length?Math.round(noPrazo.length/comPrazo.length*100)+'%':'—';
  const horas=Math.round(ts.reduce((s,t)=>s+(Number(t.tempoMin)||0),0)/60);
  const kpi=(l,v,h,c)=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="${c?'color:'+c:''}">${v}</div><div class="h">${h}</div></div>`;
  const hb=(itens)=>{const max=Math.max(1,...itens.map(i=>i.v+(i.v2||0)));return itens.map(i=>`<div class="hb"><span class="lab">${i.l}</span><div class="bar"><i style="width:${i.v/max*100}%;background:${i.c}"></i>${i.v2?`<i style="width:${i.v2/max*100}%;background:#D92D20"></i>`:''}</div><b>${i.v+(i.v2||0)}</b></div>`).join('')};
  const porStatus=S.cfg.colunas.map((c,i)=>({l:esc(c),v:ts.filter(t=>t.status===c).length,c:i===S.cfg.colunas.length-1?'#12B76A':'var(--brand)'}));
  const porCat=S.cats.map(c=>({l:esc(c.nome),v:abertas.filter(t=>t.categoria===c.nome).length,c:c.cor}));
  const porResp=[...S.equipe.map(p=>p.nome),''].map(n=>{const l=abertas.filter(t=>(t.responsavel||'')===n);const a=l.filter(t=>situacaoPrazo(t)==='late').length;return {l:esc(n||'Sem responsável'),v:l.length-a,v2:a,c:corPessoa(n)}}).filter(x=>x.v+x.v2);
  const seg=addDias(hoje,-((parseISO(hoje).getDay()+6)%7));
  const sem=[...Array(8)].map((_,i)=>{const s=addDias(seg,(i-7)*7);return {l:fmtD(s),v:ts.filter(t=>t.concluidaEm&&t.concluidaEm.slice(0,10)>=s&&t.concluidaEm.slice(0,10)<addDias(s,7)).length}});
  const maxS=Math.max(1,...sem.map(s=>s.v));
  m.innerHTML=`<div class="dash">
    ${kpi('Em aberto',abertas.length,'demandas ativas')}
    ${kpi('Atrasadas',atras.length,'prazo vencido',atras.length?'var(--red)':'')}
    ${kpi('Entregues',entregues.length,'últimos 30 dias','var(--green)')}
    ${kpi('Entregues no prazo',pct,'últimos 30 dias')}
    ${kpi('Tempo médio',leadMed+(leadMed==='—'?'':' d'),'da chegada à entrega')}
    ${kpi('Horas registradas',horas+'h','via cronômetro')}
    <div class="panel"><h4>Demandas por etapa</h4>${hb(porStatus)}</div>
    <div class="panel"><h4>Em aberto por categoria</h4>${hb(porCat)}</div>
    <div class="panel"><h4>Em aberto por responsável <span class="sub">(vermelho = atrasadas)</span></h4>${hb(porResp)||'<span class="sub">—</span>'}</div>
    <div class="panel"><h4>Entregas por semana</h4><div class="vb">${sem.map(s=>`<div class="c"><b>${s.v}</b><i style="height:${s.v/maxS*110}px"></i>${s.l}</div>`).join('')}</div></div>
  </div>`;
}

/* ---------- fundo: pessoal (navegador) > da equipe (Config) > padrão do tema ----------
   Valor do fundo: '' (padrão), '#rrggbb' (cor), 'https://…' (foto por link) ou 'data:image/…' (foto enviada, só no navegador) */
const FUNDOS=[['Azul claro','#DCE8F7'],['Menta','#DDF1E6'],['Lilás','#E9E2F7'],['Rosa','#F8E1EA'],['Areia','#F3EBDD'],['Cinza','#DADDE3'],
  ['Azul-marinho','#1F3A5F'],['Verde-floresta','#1E4D3A'],['Roxo','#3B2A63'],['Vinho','#5A1F33'],['Grafite','#2B2F36'],['Preto','#111418']];
function hexOk(c){return /^#[0-9a-f]{6}$/i.test(c||'')}
function ehFoto(v){return /^(https:\/\/|data:image\/)/i.test(v||'')}
function luminancia(hex){const n=parseInt(hex.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)}
/** Links do Google Drive viram link direto da imagem. */
function linkImagem(u){u=String(u||'').trim();const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/)||u.match(/[?&]id=([\w-]{20,})/);
  return m&&/google\.com/.test(u)?'https://lh3.googleusercontent.com/d/'+m[1]:u}
function fundoPessoal(){const p=lsGet('qd_fundo')||'';return p==='foto'?(lsGet('qd_foto')||''):p}
function aplicarFundo(v){
  if(v===undefined){const p=fundoPessoal();v=p==='padrao'?'':p||(S.cfg&&S.cfg.fundo)||''}
  const r=document.documentElement.style,cl=document.documentElement.classList;
  document.body.style.backgroundImage='';
  if(ehFoto(v)){
    // foto: véu escuro leve por cima para o texto e as colunas continuarem legíveis
    document.body.style.backgroundImage=`linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)),url("${v.replace(/"/g,'%22')}")`;
    r.setProperty('--bg','#2B2F36');r.setProperty('--colbg','color-mix(in srgb,var(--panel) 84%,transparent)');
    r.setProperty('--bgTxt','#F2F4F7');r.setProperty('--bgMuted','rgba(242,244,247,.82)');
    cl.add('fundo-escuro','fundo-foto');return;
  }
  cl.remove('fundo-foto');
  if(!hexOk(v)){['--bg','--colbg','--bgTxt','--bgMuted'].forEach(x=>r.removeProperty(x));cl.remove('fundo-escuro');return}
  const escuro=luminancia(v)<.18;
  r.setProperty('--bg',v);
  r.setProperty('--colbg',`color-mix(in srgb,var(--panel) ${escuro?'86%':'62%'},${v})`);
  r.setProperty('--bgTxt',escuro?'#F2F4F7':'#101828');r.setProperty('--bgMuted',escuro?'rgba(242,244,247,.75)':'#475467');
  cl.toggle('fundo-escuro',escuro);
}

  const origem=p==='padrao'?'o fundo padrão':p?(ehFoto(p)?'uma foto só sua':'uma cor só sua'):equipe?(ehFoto(equipe)?'a foto da equipe':'a cor da equipe'):'o fundo padrão';
  modal(`<h3>🎨 Fundo do quadro</h3>

function atualizarBtnEquipe(){const b=$('btnFundoEquipe');if(!b)return;const loc=/^data:/.test(S.fundoTmp||'');b.disabled=loc;b.title=loc?'Foto enviada do computador vale só para você. Para a equipe, use um link.':''}
function escolherFundo(c){S.fundoTmp=c;aplicarFundo(c||'');document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  const h=$('fundoHex');if(h)h.textContent=hexOk(c)?c:'';if(hexOk(c)&&$('fundoLivre'))$('fundoLivre').value=c;atualizarBtnEquipe()}
function usarLinkFundo(){
  const u=linkImagem($('fundoLink').value);
  if(!/^https:\/\/\S+$/i.test(u)){toast('Cole um link que comece com https://');return}
  const img=new Image();img.onload=()=>{escolherFundo(u);$('fundoLink').value=u;toast('Prévia aplicada. Salve para manter.')};
  img.onerror=()=>toast('Não consegui abrir essa imagem. No Drive, confira se está compartilhada com “Qualquer pessoa com o link”.');

function lerFotoFundo(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('Escolha um arquivo de imagem');return}
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    // reduz para no máx. 1920px de largura e JPEG, para caber no navegador
    const k=Math.min(1,1920/img.width,1200/img.height),cv=document.createElement('canvas');
    cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let q=.82,d=cv.toDataURL('image/jpeg',q);while(d.length>1.8e6&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q)}
    escolherFundo(d);toast('Prévia aplicada. Clique em “Só para mim” para salvar.');
  };img.onerror=()=>toast('Não consegui ler essa imagem');img.src=rd.result};
  rd.readAsDataURL(f);
}

async function salvarFundo(equipe){
  const c=S.fundoTmp||'',time=(S.cfg&&S.cfg.fundo)||'';$('modal').onclick=null;

    if(/^data:/.test(c)){toast('Foto enviada do computador vale só para você. Para a equipe, use um link.');return}
    try{const r=await call('configFundo',{cor:c});S.cfg.fundo=r.fundo}catch(e){toast('Não foi possível salvar: '+msgErro(e));return}
    lsSet('qd_fundo','');fecharModal();aplicarFundo();toast(c?'🎨 Fundo definido para toda a equipe':'🎨 Equipe voltou ao fundo padrão');
    return;
  }
  if(/^data:/.test(c)){
    try{localStorage.setItem('qd_foto',c);localStorage.setItem('qd_fundo','foto')}
    catch(e){toast('A foto é grande demais para guardar neste navegador. Tente uma menor ou use um link.');return}
  }else lsSet('qd_fundo',c===time?'':c||'padrao');
  if(!/^data:/.test(c))lsSet('qd_foto','');
  fecharModal();aplicarFundo();toast(ehFoto(c)?'🖼️ Foto de fundo salva para você':c?'🎨 Cor de fundo salva para você':'🎨 Fundo padrão');
}

S.pend={};
function pendAdd(id,campos){const p=S.pend[id]||(S.pend[id]={n:0,c:{}});p.n++;Object.assign(p.c,campos)}
function pendFim(id){const p=S.pend[id];if(p&&--p.n<=0)delete S.pend[id]}
function aplicarPendentes(){Object.keys(S.pend).forEach(id=>{const t=tarefa(id);if(t)Object.assign(t,S.pend[id].c)})}
function renderSeguro(){if(S.drag){S.renderDepois=true;return}render()}
function msgErro(e){return String((e&&(e.message||e.erro))||e||'erro').replace(/^[A-Z_]+:\s*/,'')}
function fecharDrawer(){S.aberto=null;$('ov').classList.remove('on');$('drawer').classList.remove('on');clearInterval(S.tick)}

/* ---------- ações ---------- */
async function salvarCampo(id,campo,valor){
  const t=tarefa(id);if(!t)return;
  if(JSON.stringify(t[campo])===JSON.stringify(valor))return;
  t[campo]=valor;render();if(S.aberto===id)renderDrawer();
  S.seq=S.seq||{};const sk=id+'|'+campo,sn=(S.seq[sk]=(S.seq[sk]||0)+1);
  pendAdd(id,{[campo]:valor});
  let nt;try{nt=await call('atualizar',{id,campos:{[campo]:valor}})}catch(e){pendFim(id);toast('Não foi possível salvar: '+msgErro(e));return}
  pendFim(id);
  if(S.seq[sk]!==sn)return;
  const tt=tarefa(id);if(tt&&!S.pend[id])Object.assign(tt,nt);renderSeguro();
  if(S.aberto===id){const det=await call('detalhes',{id});if(S.seq[sk]!==sn||S.aberto!==id)return;S.det=det;renderDrawer()}
}
function checkItem(id,iid){const t=tarefa(id);salvarCampo(id,'checklist',t.checklist.map(i=>i.id===iid?{...i,feito:!i.feito}:i))}
function delItem(id,iid){const t=tarefa(id);salvarCampo(id,'checklist',t.checklist.filter(i=>i.id!==iid))}
function addItem(id,txt){const t=tarefa(id);salvarCampo(id,'checklist',[...(t.checklist||[]),{id:Math.random().toString(36).slice(2,10),texto:txt,feito:false}])}
function addAnexo(id){const n=$('anxNome').value.trim(),u=$('anxUrl').value.trim();if(!/^https?:\/\//.test(u)){toast('Cole um link começando com https://');return}const t=tarefa(id);salvarCampo(id,'anexos',[...(t.anexos||[]),{nome:n||u,url:u}])}
function delAnexo(id,i){const t=tarefa(id);salvarCampo(id,'anexos',t.anexos.filter((_,j)=>j!==i))}
async function comentar(id){
  const txt=$('novoCom').value.trim();if(!txt)return;
  if(!S.me){login();return}
  $('novoCom').value='';
  const cm=await call('comentar',{id,autor:S.eu,texto:txt});
  S.det.comentarios.push(cm);const t=tarefa(id);t.comentarios=(t.comentarios||0)+1;
  render();renderDrawer();toast(/@\w/.test(txt)?'Comentário enviado e mencionados avisados':'Comentário enviado');
}
async function timer(id,modo){

}

/* =========================================================
 *  DEMANDAS RECORRENTES (mesma lógica do servidor)
 * ========================================================= */
const DSEM=['dom','seg','ter','qua','qui','sex','sab'],DSEM_NOME=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function semAc(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase()}
function dSem(s){return parseISO(s).getDay()}
function recVence(r,d){
  const base=r.inicio||'';if(base&&d<base)return false;
  const wd=DSEM.indexOf(semAc(r.dia).slice(0,3));
  switch(r.freq){
    case 'Diária':return true;
    case 'Semanal':case 'Quinzenal':{const passo=r.freq==='Semanal'?7:14;
      if(!base)return passo===7&&wd>=0&&dSem(d)===wd;
      let an=base;if(wd>=0)while(dSem(an)!==wd)an=addDias(an,1);
      const df=diasEntre(an,d);return df>=0&&df%passo===0}
    case 'Mensal':{const [a,m,dd]=d.split('-').map(Number),ult=new Date(a,m,0).getDate(),nth=nthDia(r.dia);
      if(nth)return dSem(d)===nth.wd&&(nth.n===-1?dd+7>ult:Math.ceil(dd/7)===nth.n);
      const alvo=Number(r.dia)||(base?Number(base.slice(8,10)):0);if(!alvo)return false;return dd===Math.min(alvo,ult)}
    case 'Personalizada':{const n=Math.floor(Number(r.aCada));if(!base||!(n>=1))return false;return diasEntre(base,d)%n===0}
  }
  return false;
}
function nthDia(dia){let s=semAc(dia).replace(/[º°ª]/g,'');
  s=s.replace(/^primeir\w*/,'1').replace(/^segund\w*(?=\s)/,'2').replace(/^terceir\w*/,'3').replace(/^quart\w*(?=\s)/,'4').replace(/^quint\w*(?=\s)/,'5').replace(/^ultim\w*/,'u');
  const m=s.match(/^([1-5u])\s*[oa]?\s+(dom|seg|ter|qua|qui|sex|sab)/);return m?{n:m[1]==='u'?-1:Number(m[1]),wd:DSEM.indexOf(m[2])}:null}
function recProximas(r,desde,qtd){const o=[];let d=desde;for(let i=0;i<800&&o.length<qtd;i++){if(recVence(r,d))o.push(d);d=addDias(d,1)}return o}
function recTexto(r){
  const base=r.inicio||'',wt=DSEM.indexOf(semAc(r.dia).slice(0,3)),wd=wt>=0?wt:base?dSem(base):-1,nd=wd>=0?DSEM_NOME[wd]:'',todo=wd===0||wd===6?'Todo ':'Toda ';
  switch(r.freq){
    case 'Diária':return 'Todos os dias';
    case 'Semanal':return nd?todo+nd:'Semanal';
    case 'Quinzenal':return 'A cada 2 semanas'+(nd?` (${nd})`:'');
    case 'Mensal':{const nth=nthDia(r.dia);if(nth){const ms=nth.wd===0||nth.wd===6;return (ms?'Todo ':'Toda ')+(nth.n===-1?(ms?'último ':'última '):nth.n+(ms?'º ':'ª '))+DSEM_NOME[nth.wd]+' do mês'}
      const dm=Number(r.dia)||(base?Number(base.slice(8,10)):0);return dm?`Todo dia ${dm} do mês`+(dm>28?' (ou o último dia)':''):'Mensal'}
    case 'Personalizada':{const n=Math.floor(Number(r.aCada));return n===1?'Todos os dias':`A cada ${n} dias`}
  }
  return r.freq||'—';
}
function ehRecorrente(t){const o=String(t.origem||'');return o.indexOf('rec:')===0||o==='recorrente'}
function recDe(t){const o=String(t.origem||'');if(o.indexOf('rec:')!==0)return null;const id=o.split(':')[1];return (S.recs||[]).find(r=>r.id===id)||null}
function podeRec(r){return r&&(gestor()||(S.me&&(r.criadoPor===S.me.nome||r.responsavel===S.me.nome)))&&perfil()!=='Leitor'}
function lerRepForm(){
  const f=$('nRep')&&$('nRep').value;if(!f)return null;
  const inicio=$('nIni').value||hojeISO();
  if(inicio<hojeISO())return {erro:'A data de início não pode ser no passado'};
  const aCada=f==='Personalizada'?Math.floor(Number($('nRepN').value)):'';
  if(f==='Personalizada'&&!(aCada>=1&&aCada<=365))return {erro:'Informe de quantos em quantos dias (1 a 365)'};
  const prazo=$('nPrazo').value;
  if(prazo&&prazo<inicio)return {erro:'O prazo precisa ser no mesmo dia ou depois do início'};
  return {freq:f,aCada,inicio,prazoDias:prazo?diasEntre(inicio,prazo):''};
}
function atualizarRep(){
  const f=$('nRep').value,info=$('nRepInfo');
  $('nIniBox').style.visibility=f?'visible':'hidden';
  $('nRepNBox').style.display=f==='Personalizada'?'':'none';
  $('nPrazoLbl').textContent=f?'Prazo da 1ª entrega':'Prazo';
  if(!f){info.style.display='none';return}
  const r=lerRepForm();info.style.display='';
  if(r.erro){info.innerHTML='⚠️ '+esc(r.erro);return}
  const regra={freq:r.freq,aCada:r.aCada,inicio:r.inicio};
  const prox=recProximas(regra,r.inicio,4);
  info.innerHTML=`🔁 <b>${esc(recTexto(regra))}</b>, a partir de ${fmtBR(r.inicio)}.<br>
    Próximas: ${prox.map(fmtD).join(' · ')}${r.prazoDias!==''?`<br>Cada uma com prazo de ${r.prazoDias===0?'entrega no mesmo dia':r.prazoDias+' dia'+(r.prazoDias===1?'':'s')+' depois de criada'}.`:''}
    <br><span class="sub">A primeira já entra no quadro agora. As próximas aparecem sozinhas às 7h do dia.</span>`;
}
function recDrawerHTML(t){
  if(!ehRecorrente(t))return '';
  const r=recDe(t);
  if(!r)return `<div class="sec"><h5>🔁 Recorrência</h5><div class="sub">Criada por uma regra da aba Recorrentes da planilha.</div></div>`;
  return `<div class="sec"><h5>🔁 Recorrência</h5><div class="rec-box">
    <div><b>${esc(r.texto)}</b> ${r.ativa?'<span class="rec-st on">ativa</span>':'<span class="rec-st">pausada</span>'}</div>
    <div class="sub">${r.ativa&&r.proxima?'Próxima: '+fmtBR(r.proxima):'Não vai gerar novas demandas enquanto estiver pausada.'}${r.criadoPor?' · criada por '+esc(r.criadoPor):''}</div>
    ${podeRec(r)?`<button class="btn sm" onclick="alternarRec('${esc(r.id)}',${!r.ativa})">${r.ativa?'⏸ Parar de repetir':'▶ Retomar'}</button>`:''}
  </div></div>`;
}
async function alternarRec(id,ativa){
  let nr;try{nr=await call('recorrenciaAlternar',{id,ativa})}catch(e){toast('Não foi possível alterar: '+msgErro(e));return}
  const i=S.recs.findIndex(r=>r.id===id);if(i>=0)S.recs[i]=nr;else S.recs.push(nr);
  toast(ativa?'▶ Recorrência retomada':'⏸ Recorrência pausada. As demandas já criadas continuam no quadro.');
  render();if(S.aberto)renderDrawer();if($('modal').classList.contains('on')&&$('recLista'))renderRecorrentes();
}

/* ---------- pop-up de nova demanda ---------- */
function chaveU(k){return 'qd_'+k+'_'+((S.me&&S.me.nome)||'x')}
function lerSet(k){try{return new Set(JSON.parse(lsGet(chaveU(k))||'[]'))}catch(e){return new Set()}}
function gravarSet(k,set){lsSet(chaveU(k),JSON.stringify([...set].slice(-800)))}
function ehNova(id){return lerSet('novas').has(id)}
function marcarVista(id){const n=lerSet('novas');if(n.delete(id)){gravarSet('novas',n);render()}}
function relevante(t,me){
  if(!me||t.arquivada==='SIM'||(S.cfg&&t.status===S.cfg.colunaFinal))return false;
  if(me.perfil==='Gestor')return true;
  if(me.perfil==='Membro')return t.responsavel===me.nome;
  return false;
}
function detectarNovas(lista,me){
  if(!me)return;
  const vistos=lerSet('vistos');const primeira=!lsGet(chaveU('vistos'));
  const novas=lista.filter(t=>!vistos.has(t.id));
  lista.forEach(t=>vistos.add(t.id));gravarSet('vistos',vistos);
  if(primeira)return; // primeiro acesso: não inunda de pop-ups
  const rel=novas.filter(t=>relevante(t,me));
  if(!rel.length)return;
  const n=lerSet('novas');rel.forEach(t=>n.add(t.id));gravarSet('novas',n);
  bip();
  if(rel.length>3){mostrarPop({resumo:rel.length});rel.slice(0,2).forEach(t=>mostrarPop(t))}
  else rel.forEach(t=>mostrarPop(t));
  try{if(window.Notification&&Notification.permission==='granted')rel.slice(0,3).forEach(t=>new Notification('Nova demanda cadastrada',{body:t.titulo+(t.responsavel?' — '+t.responsavel:'')}))}catch(e){}
}
function mostrarPop(t){
  const el=document.createElement('div');el.className='pop';
  if(t.resumo){
    el.innerHTML=`<div class="hd">🔔 ${t.resumo} novas demandas<button class="x" onclick="this.closest('.pop').remove()">✕</button></div>
      <div class="ln" style="margin-top:6px">Chegaram enquanto você estava fora. Elas estão marcadas com <span class="novo">NOVA</span> no quadro.</div>`;
  }else{
    const c=cat(t.categoria);el.style.setProperty('--c',c.cor);
    el.innerHTML=`<div class="hd">🔔 Nova demanda cadastrada<button class="x" onclick="this.closest('.pop').remove()">✕</button></div>
      <div style="margin-top:6px"><span class="tag" style="--c:${c.cor}">${esc(c.nome)}</span> ${t.prioridade==='Urgente'?'<span class="prio Urgente">🔥 Urgente</span>':''}</div>
      <div class="tt">${esc(t.titulo)}</div>
      <div class="ln">${t.solicitante?'👤 '+esc(t.solicitante)+' · ':''}${t.prazo?'🗓 '+fmtBR(t.prazo)+' · ':''}${t.responsavel?'Responsável: <b>'+esc(t.responsavel)+'</b>':'<b style="color:var(--amber)">Sem responsável</b>'}</div>
      <div class="ac"><button class="btn pri sm" onclick="this.closest('.pop').remove();abrir('${t.id}')">Abrir demanda</button><button class="btn sm" onclick="this.closest('.pop').remove()">Depois</button></div>`;
  }
  $('pops').prepend(el);
  while($('pops').children.length>4)$('pops').lastChild.remove();
  setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),400)},60000);
}
function bip(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+i*.16);g.gain.exponentialRampToValueAtTime(.15,a.currentTime+i*.16+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+i*.16+.22);o.start(a.currentTime+i*.16);o.stop(a.currentTime+i*.16+.25)})}catch(e){}}
function pedirNotificacao(){try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
document.addEventListener('click',pedirNotificacao,{once:true});

function mockApi(acao,p){
  if(!DB)DB=mockSeed();
  const agora=()=>hojeISO()+' '+new Date().toTimeString().slice(0,5);
  const log=(id,a,d)=>(DB.hist[id]=DB.hist[id]||[]).unshift({data:agora(),autor:p.autor||S.eu||'Você',acao:a,detalhe:d});
  const find=id=>DB.tarefas.find(t=>t.id===id);
  if(acao==='equipeLogin')return {nome:'Sýstima (demo)',pessoas:DB.equipe.map(m=>({nome:m.nome,funcao:m.funcao}))};
  const me=DB.equipe.find(m=>m.nome===p.autor&&m.pin===p.pin);
  if(!me)throw new Error('LOGIN');
  const recCli=r=>{const desde=r.ultima&&r.ultima>=hojeISO()?addDias(r.ultima,1):hojeISO();return {...r,texto:recTexto(r),proxima:r.ativa?(recProximas(r,r.inicio>desde?r.inicio:desde,1)[0]||''):''}};
  if(!['board','detalhes'].includes(acao)){
    if(me.perfil==='Leitor')throw new Error('SEM_PERMISSAO: seu perfil é de leitura');
    if(me.perfil==='Membro'&&['mover','atualizar','timer','tempoManual'].includes(acao)){const t=find(p.id);
      if(t.responsavel&&t.responsavel!==me.nome)throw new Error('SEM_PERMISSAO: você só pode alterar as suas demandas');
      if(p.campos&&'arquivada' in p.campos)throw new Error('SEM_PERMISSAO: só gestores arquivam demandas');
      if(p.campos&&p.campos.responsavel&&p.campos.responsavel!==me.nome)throw new Error('SEM_PERMISSAO: só gestores atribuem demandas a outras pessoas');}
  }
  switch(acao){
    case 'configFundo':{if(me.perfil!=='Gestor')throw new Error('SEM_PERMISSAO: só gestores definem a cor de fundo da equipe');DB.fundo=p.cor||'';return {fundo:DB.fundo}}
    case 'board':return JSON.parse(JSON.stringify({config:{nome:'Sýstima (demo)',cor:'#1F3A5F',fundo:DB.fundo||'',colunas:['Novo','Em produção','Revisão','Entregue'],colunaFinal:'Entregue',prioridades:['Baixa','Normal','Alta','Urgente'],agenda:true},
      me:{nome:me.nome,perfil:me.perfil},categorias:DB.cats,equipe:DB.equipe.map(({pin,...m})=>m),tarefas:DB.tarefas.filter(t=>p.arquivadas||t.arquivada!=='SIM').map(t=>({...t,comentarios:(DB.com[t.id]||[]).length})),recorrencias:DB.recs.map(recCli)}));
    case 'recorrenciaAlternar':{const r=DB.recs.find(x=>x.id===p.id);if(!r)throw new Error('Recorrência não encontrada');
      if(me.perfil!=='Gestor'&&r.criadoPor!==me.nome&&r.responsavel!==me.nome)throw new Error('SEM_PERMISSAO: só um gestor, quem criou ou o responsável pausa esta recorrência');
      r.ativa=!!p.ativa;if(r.ativa&&(!r.ultima||r.ultima<hojeISO()))r.ultima=addDias(hojeISO(),-1);return recCli(r)}
    case 'detalhes':return {comentarios:DB.com[p.id]||[],historico:(DB.hist[p.id]||[]).concat([{data:find(p.id).criadoEm,autor:'Formulário',acao:'Criou',detalhe:'via formulário'}])};
    case 'mover':case 'atualizar':{
      const t=find(p.id);const campos=acao==='mover'?{status:p.status,ordem:p.ordem}:p.campos;
      Object.keys(campos).forEach(k=>{if(JSON.stringify(t[k])!==JSON.stringify(campos[k])&&k!=='ordem')log(t.id,k,typeof campos[k]==='object'?'atualizado':`${t[k]||'—'} → ${campos[k]||'—'}`);t[k]=campos[k]});
      if(campos.status)t.concluidaEm=campos.status==='Entregue'?agora():'';
      t.eventoId=t.prazo&&t.arquivada!=='SIM'?'ev':'';
      return JSON.parse(JSON.stringify(t));}
    case 'criar':{const d=p.dados;const c=DB.cats.find(x=>x.nome===d.categoria);
      const rc=d.recorrencia,base=rc?(d.inicio||hojeISO()):hojeISO();let regra=null;
      if(rc){if(rc.freq==='Personalizada'&&!(Number(rc.aCada)>=1))throw new Error('Informe de quantos em quantos dias');
        regra={id:'R'+Date.now(),ativa:true,titulo:d.titulo,categoria:d.categoria,responsavel:d.responsavel||(c?c.responsavel:''),freq:rc.freq,dia:'',aCada:String(rc.aCada||''),inicio:base,ultima:base,prazoDias:d.prazo?String(diasEntre(base,d.prazo)):'',criadoPor:me.nome};
        DB.recs.push(regra)}
      const t={id:'T'+Date.now(),criadoEm:agora(),titulo:d.titulo+(rc?' — '+base.slice(8,10)+'/'+base.slice(5,7):''),categoria:d.categoria,status:d.status||'Novo',responsavel:d.responsavel||(c?c.responsavel:''),inicio:base,
        prazo:d.prazo||(c?addDias(base,c.sla):''),prioridade:d.prioridade||'Normal',etiquetas:'',solicitante:d.solicitante,contato:'',emailSolicitante:'',
        briefing:d.descricao?[{p:'Descrição',r:d.descricao}]:[],anexos:[],checklist:(c?c.checklist:[]).map(x=>({id:Math.random().toString(36).slice(2,8),texto:x,feito:false})),
        estimativa:'',tempoMin:'0',timerInicio:'',timerAutor:'',eventoId:'ev',arquivada:'NAO',concluidaEm:'',atualizadoEm:agora(),ordem:String(Date.now()),origem:regra?'rec:'+regra.id+':'+base:'manual'};
      DB.tarefas.push(t);log(t.id,'Criou',regra?'recorrência':'manual');if(regra)log(t.id,'Recorrência',recTexto(regra));
      const o=JSON.parse(JSON.stringify(t));if(regra)o._recorrencia=recCli(regra);return o;}
    case 'comentar':{const c={id:'c'+Date.now(),autor:p.autor,texto:p.texto,data:agora()};(DB.com[p.id]=DB.com[p.id]||[]).push(c);return c}
    case 'timer':{const t=find(p.id);if(p.modo==='iniciar'){t.timerInicio=String(Date.now());log(t.id,'Timer','iniciado')}else{if(t.timerInicio){t.tempoMin=String(Number(t.tempoMin)+Math.max(1,Math.round((Date.now()-t.timerInicio)/6e4)))}t.timerInicio='';log(t.id,'Timer','parado')}return JSON.parse(JSON.stringify(t))}
    case 'tempoManual':{const t=find(p.id);t.tempoMin=String(Math.max(0,Number(t.tempoMin)+Number(p.minutos)));log(t.id,'Tempo',p.minutos+' min');return JSON.parse(JSON.stringify(t))}
  }
}
